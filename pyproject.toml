[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desave"
version = "1.0.0"
description = "Did Germany really save electricity in the 2022 energy crisis? Weather- and holiday-adjusted savings estimate plus a daily demand forecast."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "requests>=2.31",
  "pyyaml>=6",
  "holidays>=0.60",
  "lightgbm>=4.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desave = "desave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desave = ["web/template.html", "web/germany.json", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "realdata: needs the real downloaded data in data/ (skipped if missing)",
  "slow: trains models; takes up to a few minutes",
]
