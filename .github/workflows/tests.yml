name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Fast tests (data checks, clock changes, holidays, parsers, models)
        run: pytest -m "not slow" -q
      - name: Slow tests (full run on stand-in data with a planted saving)
        run: pytest -m "slow" -q
