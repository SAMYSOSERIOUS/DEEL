name: monthly retrain

# First day of each month: retrain the daily model on all data (it only replaces
# the old model if it beats "same week last year" on the last 4 weeks), refresh
# the savings analysis with the newest months, rebuild report and page.
on:
  schedule:
    - cron: "43 2 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Replace the model even if it fails the 4-week check"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Download new data
        run: desave download
      - name: Retrain and refresh the analysis
        run: desave retrain ${{ inputs.force && '--force' || '' }}
      - name: Save
        run: |
          git config user.name "desave-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data results site models reports README.md
          git diff --cached --quiet || git commit -m "Monthly retrain $(date -u +%Y-%m)"
          git pull --rebase --autostash origin main && git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: retrain
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
